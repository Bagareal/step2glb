name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build portable app
        run: python -m PyInstaller --noconfirm --clean STEP2GLB.spec

      - name: Smoke test the built exe
        shell: bash
        run: |
          python tests/make_sample.py sample.step
          dist/STEP2GLB/step2glb-cli.exe sample.step -q draft -o smoke
          test -s smoke/sample.glb
          dist/STEP2GLB/step2glb-cli.exe --version
          # STEP2GLB.exe must be a windowed app (PE subsystem 2 = GUI), so no console flashes
          python -c "import struct,sys; d=open('dist/STEP2GLB/STEP2GLB.exe','rb').read(4096); o=struct.unpack_from('<I',d,0x3C)[0]; s=struct.unpack_from('<H',d,o+0x5C)[0]; print('subsystem',s); sys.exit(s!=2)"

      - name: Zip
        shell: bash
        run: |
          mkdir release
          cp README.md LICENSE dist/STEP2GLB/
          cd dist && 7z a -tzip -mx=5 ../release/STEP2GLB-windows-x64.zip STEP2GLB

      - uses: actions/upload-artifact@v4
        with:
          name: STEP2GLB-windows-x64
          path: release/STEP2GLB-windows-x64.zip
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/STEP2GLB-windows-x64.zip --generate-notes --title "$GITHUB_REF_NAME"
