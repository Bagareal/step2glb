name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: STEP2GLB-windows-x64.zip
            cli: dist/STEP2GLB/step2glb-cli.exe
          - os: macos-latest  # Apple Silicon (arm64)
            asset: STEP2GLB-macos-arm64.zip
            cli: dist/STEP2GLB.app/Contents/MacOS/step2glb-cli
          - os: ubuntu-22.04  # oldest glibc still supported, so it runs on newer distros (Arch, Omarchy...)
            asset: STEP2GLB-linux-x64.tar.gz
            cli: dist/STEP2GLB/step2glb-cli
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Tk and a virtual display (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libtk8.6 xvfb

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build portable app
        run: python -m PyInstaller --noconfirm --clean STEP2GLB.spec

      - name: Smoke test the command line exe
        shell: bash
        run: |
          python tests/make_sample.py sample.step
          "${{ matrix.cli }}" sample.step -q draft -o smoke
          test -s smoke/sample.glb
          "${{ matrix.cli }}" --version

      - name: Check STEP2GLB.exe is a windowed app
        if: runner.os == 'Windows'
        shell: bash
        # PE subsystem 2 = GUI, so no console window flashes on start
        run: python -c "import struct,sys; d=open('dist/STEP2GLB/STEP2GLB.exe','rb').read(4096); o=struct.unpack_from('<I',d,0x3C)[0]; s=struct.unpack_from('<H',d,o+0x5C)[0]; print('subsystem',s); sys.exit(s!=2)"

      - name: Check the .app opens the window, not the CLI
        if: runner.os == 'macOS'
        run: |
          exe=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" dist/STEP2GLB.app/Contents/Info.plist)
          echo "CFBundleExecutable=$exe"
          test "$exe" = "STEP2GLB"
          test -x dist/STEP2GLB.app/Contents/MacOS/STEP2GLB

      - name: Check the window starts and converts a file (Linux)
        if: runner.os == 'Linux'
        run: |
          python tests/make_sample.py window.step
          xvfb-run -a dist/STEP2GLB/STEP2GLB window.step &
          for i in $(seq 1 90); do [ -s window.glb ] && break; sleep 1; done
          pkill -f dist/STEP2GLB/STEP2GLB || true
          test -s window.glb

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir release
          cp README.md LICENSE dist/STEP2GLB/
          cd dist && 7z a -tzip -mx=5 "../release/${{ matrix.asset }}" STEP2GLB

      - name: Zip (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir release
          ditto -c -k --keepParent dist/STEP2GLB.app "release/${{ matrix.asset }}"

      - name: Archive (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir release
          cp README.md LICENSE packaging/linux/install.sh packaging/linux/step2glb.png dist/STEP2GLB/
          tar -C dist -czf "release/${{ matrix.asset }}" STEP2GLB

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: release/${{ matrix.asset }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l release
          # The release may already exist (created from the GitHub web page with a new tag):
          # then only attach the archives to it.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" \
              --generate-notes --title "$GITHUB_REF_NAME"
          fi
